[package]
name = "prompt-injection-v1"
version = "0.1.0"
edition = "2024"
publish = false
description = "Kooix Gate v1 WASM transform plugin: prompt injection heuristic detector (ADR-0006 / M6.1)"
# Cargo runs tests in host (x86_64) target; the wit-bindgen `export!` macro
# generates `cabi_post_*` symbols whose `:` characters trip linker name parsing
# when the cdylib target is built for host. Disable integration tests (we keep
# golden checks as unit tests inside src/rules.rs so they still run via
# `cargo test --lib`).
autotests = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen-rt = "0.44"
wit-bindgen = { version = "0.57", default-features = false, features = ["macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-case", "unicode-perl"] }
once_cell = "1"

[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
