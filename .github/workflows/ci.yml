# Recommended branch protection for `main`:
# Required checks: check, test, db, security, web
name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_TOOLCHAIN: "stable"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    name: Check + Clippy + Format
    runs-on: ${{ fromJSON(vars.KOOIX_CI_RUNNER || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        if: ${{ !contains(fromJSON(vars.KOOIX_CI_RUNNER || '["ubuntu-latest"]'), 'self-hosted') }}
      - run: git diff --check
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo check --workspace
      - run: node scripts/quality-gate.mjs
      - run: node scripts/check-route-manifest.mjs
      - run: node scripts/generate-route-types.mjs --check
      - run: node scripts/perf-smoke.mjs --check-script-only

  test:
    name: Tests
    runs-on: ${{ fromJSON(vars.KOOIX_CI_RUNNER || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        if: ${{ !contains(fromJSON(vars.KOOIX_CI_RUNNER || '["ubuntu-latest"]'), 'self-hosted') }}
      - run: cargo test --workspace
        env:
          KOOIX_TEST_PG_TAG: "17-alpine"
      - run: node scripts/perf-smoke.mjs

  db:
    name: DB Migration Gate
    runs-on: ${{ fromJSON(vars.KOOIX_CI_RUNNER || '["ubuntu-latest"]') }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kooix_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        if: ${{ !contains(fromJSON(vars.KOOIX_CI_RUNNER || '["ubuntu-latest"]'), 'self-hosted') }}
      - run: cargo run -p kgctl -- migrate --dry-run
        env:
          KOOIX_DATABASE_URL: postgres://postgres:postgres@localhost:5432/kooix_ci
      - run: cargo run -p kgctl -- migrate
        env:
          KOOIX_DATABASE_URL: postgres://postgres:postgres@localhost:5432/kooix_ci
      - run: cargo run -p kgctl -- migrate --dry-run
        env:
          KOOIX_DATABASE_URL: postgres://postgres:postgres@localhost:5432/kooix_ci

  security:
    name: Security Smoke
    runs-on: ${{ fromJSON(vars.KOOIX_CI_RUNNER || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        if: ${{ !contains(fromJSON(vars.KOOIX_CI_RUNNER || '["ubuntu-latest"]'), 'self-hosted') }}
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit --ignore RUSTSEC-2023-0071
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  web:
    name: Web Build
    runs-on: ${{ fromJSON(vars.KOOIX_CI_RUNNER || '["ubuntu-latest"]') }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run bundle:budget
