# Recommended branch protection for `main`:
# Required checks: check, test, db, security, web
#
# 历史：0.4.176 因 GH Free private repo Actions 额度耗尽暂停过自动触发。
# v0.5.0-rc2 仓库切公开后恢复自动触发，docker/release 仍保持 workflow_dispatch
# 手动出包以控发版节奏。
name: CI
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_TOOLCHAIN: "stable"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Keep GitHub-hosted runners on normal setup actions, but avoid unnecessary
  # network/tool cache mutation on the local self-hosted runner. The self-hosted
  # path exists only to bypass account billing/spending-limit outages and should
  # use already installed toolchains.
  # Remove repo variable KOOIX_CI_RUNNER to fall back to ubuntu-latest.
  check:
    name: Check + Clippy + Format
    runs-on: ${{ fromJSON(vars.KOOIX_CI_RUNNER || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ !contains(fromJSON(vars.KOOIX_CI_RUNNER || '["ubuntu-latest"]'), 'self-hosted') }}
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
      - name: Use preinstalled Rust toolchain
        if: ${{ contains(fromJSON(vars.KOOIX_CI_RUNNER || '["ubuntu-latest"]'), 'self-hosted') }}
        run: |
          rustup default "${RUST_TOOLCHAIN}"
          rustc --version
          cargo --version
          cargo fmt --version
          cargo clippy --version
      - uses: Swatinem/rust-cache@v2
        if: ${{ !contains(fromJSON(vars.KOOIX_CI_RUNNER || '["ubuntu-latest"]'), 'self-hosted') }}
      - run: git diff --check
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo check --workspace
      - run: node scripts/quality-gate.mjs
      - run: node scripts/check-route-manifest.mjs
      - run: node scripts/generate-route-types.mjs --check
      - run: node scripts/perf-smoke.mjs --check-script-only

  test:
    name: Tests
    runs-on: ${{ fromJSON(vars.KOOIX_CI_RUNNER || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ !contains(fromJSON(vars.KOOIX_CI_RUNNER || '["ubuntu-latest"]'), 'self-hosted') }}
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Use preinstalled Rust toolchain
        if: ${{ contains(fromJSON(vars.KOOIX_CI_RUNNER || '["ubuntu-latest"]'), 'self-hosted') }}
        run: |
          rustup default "${RUST_TOOLCHAIN}"
          rustc --version
          cargo --version
      - uses: Swatinem/rust-cache@v2
        if: ${{ !contains(fromJSON(vars.KOOIX_CI_RUNNER || '["ubuntu-latest"]'), 'self-hosted') }}
      - run: cargo test --workspace
        env:
          KOOIX_TEST_PG_TAG: "17-alpine"
      - run: node scripts/perf-smoke.mjs

  db:
    name: DB Migration Gate
    runs-on: ${{ fromJSON(vars.KOOIX_CI_RUNNER || '["ubuntu-latest"]') }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kooix_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ !contains(fromJSON(vars.KOOIX_CI_RUNNER || '["ubuntu-latest"]'), 'self-hosted') }}
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Use preinstalled Rust toolchain
        if: ${{ contains(fromJSON(vars.KOOIX_CI_RUNNER || '["ubuntu-latest"]'), 'self-hosted') }}
        run: |
          rustup default "${RUST_TOOLCHAIN}"
          rustc --version
          cargo --version
      - uses: Swatinem/rust-cache@v2
        if: ${{ !contains(fromJSON(vars.KOOIX_CI_RUNNER || '["ubuntu-latest"]'), 'self-hosted') }}
      - run: cargo run -p kgctl -- migrate --dry-run
        env:
          KOOIX_DATABASE_URL: postgres://postgres:postgres@localhost:5432/kooix_ci
      - run: cargo run -p kgctl -- migrate
        env:
          KOOIX_DATABASE_URL: postgres://postgres:postgres@localhost:5432/kooix_ci
      - run: cargo run -p kgctl -- migrate --dry-run
        env:
          KOOIX_DATABASE_URL: postgres://postgres:postgres@localhost:5432/kooix_ci

  security:
    name: Security Smoke
    runs-on: ${{ fromJSON(vars.KOOIX_CI_RUNNER || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ !contains(fromJSON(vars.KOOIX_CI_RUNNER || '["ubuntu-latest"]'), 'self-hosted') }}
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Use preinstalled Rust toolchain
        if: ${{ contains(fromJSON(vars.KOOIX_CI_RUNNER || '["ubuntu-latest"]'), 'self-hosted') }}
        run: |
          rustup default "${RUST_TOOLCHAIN}"
          rustc --version
          cargo --version
      - uses: Swatinem/rust-cache@v2
        if: ${{ !contains(fromJSON(vars.KOOIX_CI_RUNNER || '["ubuntu-latest"]'), 'self-hosted') }}
      - name: Install cargo-audit
        run: |
          if ! command -v cargo-audit >/dev/null 2>&1; then
            cargo install cargo-audit --locked
          fi
      - run: cargo audit --ignore RUSTSEC-2023-0071
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          if command -v gitleaks >/dev/null 2>&1; then
            gitleaks version
            exit 0
          fi
          if [ -x "$HOME/.local/bin/gitleaks" ]; then
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            "$HOME/.local/bin/gitleaks" version
            exit 0
          fi
          mkdir -p "$HOME/.local/bin" /tmp/gitleaks
          curl -fsSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks/gitleaks.tar.gz
          tar -C /tmp/gitleaks -xzf /tmp/gitleaks/gitleaks.tar.gz gitleaks
          install -m 0755 /tmp/gitleaks/gitleaks "$HOME/.local/bin/gitleaks"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/gitleaks" version
      - name: Secret scan
        run: |
          gitleaks detect --source . --redact --verbose
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          git ls-files -co --exclude-standard -z | tar --null -T - -cf - | tar -C "$tmp" -xf -
          gitleaks detect --source "$tmp" --no-git --redact --verbose

  web:
    name: Web Build
    runs-on: ${{ fromJSON(vars.KOOIX_CI_RUNNER || '["ubuntu-latest"]') }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: ${{ !contains(fromJSON(vars.KOOIX_CI_RUNNER || '["ubuntu-latest"]'), 'self-hosted') }}
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Use preinstalled Node.js
        if: ${{ contains(fromJSON(vars.KOOIX_CI_RUNNER || '["ubuntu-latest"]'), 'self-hosted') }}
        run: |
          node --version
          npm --version
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run bundle:budget
