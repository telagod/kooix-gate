name: Release
# 0.4.176：见 ci.yml 同步暂停说明。tag push 不再自动建 GitHub Release，需手动
# 走 `gh release create -F /tmp/notes.md` 或恢复 workflow。
on:
  workflow_dispatch:
  # push:
  #   tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render release notes
        run: node scripts/render-release-notes.mjs "$GITHUB_REF_NAME" > /tmp/release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: Kooix Gate ${{ github.ref_name }}
          body_path: /tmp/release-notes.md
          generate_release_notes: false
