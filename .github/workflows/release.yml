name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render release notes
        run: node scripts/render-release-notes.mjs "$GITHUB_REF_NAME" > /tmp/release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: Kooix Gate ${{ github.ref_name }}
          body_path: /tmp/release-notes.md
          generate_release_notes: false
