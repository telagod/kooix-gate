[package]
name = "wasm-transform-v1-example"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen-rt = "0.44"
wit-bindgen = { version = "0.57", default-features = false, features = ["macros"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
