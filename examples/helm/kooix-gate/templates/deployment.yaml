apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kooix-gate.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "kooix-gate.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "kooix-gate.name" . }}
    spec:
      containers:
        - name: gate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            - name: KOOIX_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "kooix-gate.fullname" . }}
                  key: KOOIX_MASTER_KEY
            - name: KOOIX_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "kooix-gate.fullname" . }}
                  key: KOOIX_JWT_SECRET
            {{ with .Values.secretEnv.KOOIX_JWT_PREVIOUS_SECRETS }}
            - name: KOOIX_JWT_PREVIOUS_SECRETS
              valueFrom:
                secretKeyRef:
                  name: {{ include "kooix-gate.fullname" $ }}
                  key: KOOIX_JWT_PREVIOUS_SECRETS
            {{ end }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
