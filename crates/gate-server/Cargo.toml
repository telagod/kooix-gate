[package]
name = "gate-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "gate-server"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
gate-core      = { path = "../gate-core" }
gate-auth      = { path = "../gate-auth" }
gate-crypto    = { path = "../gate-crypto" }
gate-storage   = { path = "../gate-storage" }
gate-cache     = { path = "../gate-cache" }
gate-providers = { path = "../gate-providers" }
gate-billing   = { path = "../gate-billing" }

# DB pool 类型透传
sqlx.workspace = true

# Web
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
hyper.workspace = true

# Async
tokio.workspace = true
reqwest.workspace = true
bytes = "1"
async-trait.workspace = true
futures.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# IDs / time
uuid.workspace = true
chrono.workspace = true
rust_decimal.workspace = true

# Errors / log
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Telemetry / metrics
opentelemetry.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry_sdk.workspace = true
tracing-opentelemetry.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true

# Config
figment.workspace = true

# Validation
validator.workspace = true

# CSV export
csv = "1"
parking_lot = "0.12"

# SSO state hash + base64
sha2.workspace = true
hex.workspace = true
base64.workspace = true
rand.workspace = true
openidconnect.workspace = true

# Redis (for channel rate limiter)
fred.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["full", "macros"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres", "redis"] }
wiremock = "0.6"
futures.workspace = true
gate-crypto = { path = "../gate-crypto" }
sha2.workspace = true
hex.workspace = true
